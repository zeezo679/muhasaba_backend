services:
  postgres:
    image: postgres:17-alpine
    container_name: muhasabaa-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "Muhasba@Dev2026"
      POSTGRES_DB: muhasaba
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d muhasaba"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: